<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ร้อยละ MEGA SALE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Itim&family=Kanit:ital,wght@0,500;0,700;0,800;1,700;1,800&display=swap">
<style>
/* Layout: ใบปลิวโปรห้างบนจอโปรเจกเตอร์ — ทุกขนาดอิงความกว้าง/สูงของจอ (rem โตตามจอ) หน้าเกมพอดีหนึ่งจอไม่ต้องเลื่อน
   แถบหัวแดง · เวทีกลาง · แถบเคาน์เตอร์คิดเงิน 3 ทีมติดล่าง
   Theme: ตั้งใจใช้โลกเดียว (ใบปลิวกระดาษเหลือง หมึกดำ ป้ายแดง) เพื่อให้อ่านชัดบนโปรเจกเตอร์ทุกห้อง */
:root{
  --paper:#FFF3C4; --paper-2:#F6E29A; --card:#FFFFFF; --ink:#1E1A24; --ink-2:#5C5664; --rule:#E2CF85;
  --sale:#DA2230; --sale-2:#A3101B; --burst:#FFD12E; --on-sale:#FFFFFF; --scrim:rgba(30,26,36,.62);
  --ok:#13804A; --no:#C2361E;
  --t0:#1B76CF; --t1:#14905A; --t2:#8338C9;
  --v-p10:#FFB21E; --v-p20:#EE6A1C; --v-p30:#DA2230; --v-f50:#1E1A24; --v-x10:#0B7C78; --v-cb20:#BF1E5E;
  --f-display:"Kanit","Leelawadee UI","Tahoma",sans-serif;
  --f-hand:"Itim","Leelawadee UI","Tahoma",sans-serif;
  --f-body:"Anuphan","Leelawadee UI","Tahoma",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
/* 1rem โตตามจอ: 1366×768 ≈ 18px · 1920×1080 ≈ 25px · ไม่ต่ำกว่า 15px */
html{font-size:max(15px,min(1.32vw,2.35vh));-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sale)}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:.3rem .5rem;min-width:0;width:100%}
input[type=checkbox]{width:auto}
textarea{resize:vertical}
:focus-visible{outline:3px solid var(--t0);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;height:100%}
.top{display:flex;align-items:center;gap:.4rem 1rem;flex-wrap:wrap;background:var(--sale);color:var(--on-sale);border-bottom:.2rem solid var(--ink);padding-block:.3rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{background:none;border:0;padding:0;font-family:var(--f-display);font-weight:800;font-style:italic;font-size:1.3rem;color:var(--on-sale);white-space:nowrap;line-height:1.25}
.logo span{color:var(--burst)}
.nav{display:flex;gap:.25rem;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:transparent;border:2px solid transparent;color:var(--on-sale);border-radius:999px;padding:.05rem .75rem;font-weight:600;white-space:nowrap;font-size:.95rem}
.nav button:hover{border-color:var(--on-sale)}
.nav button[aria-current="page"]{background:var(--burst);color:var(--ink);border-color:var(--ink)}
.tools{display:flex;gap:.3rem}
.tool{background:var(--sale-2);border:2px solid var(--ink);color:var(--on-sale);border-radius:8px;padding:.05rem .6rem;font-size:.8rem;font-weight:600;white-space:nowrap}
#view{overflow:auto;min-height:0;padding-block:.75rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:110rem;margin-inline:auto}
.fit{height:100%;min-height:0;display:grid;gap:.75rem}
.eyebrow{font-family:var(--f-hand);font-size:1.15rem;color:var(--sale);letter-spacing:.02em;line-height:1.3}
.muted{color:var(--ink-2)}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.row.end{justify-content:flex-end}

.btn{border:.17rem solid var(--ink);background:var(--card);border-radius:.6rem;padding:.3rem .85rem;font-weight:700;line-height:1.3;box-shadow:.17rem .17rem 0 var(--ink);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:.25rem .25rem 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--sale);color:var(--on-sale)}
.btn.yellow{background:var(--burst)}
.btn.ghost{box-shadow:none;background:transparent}
.btn.sm{font-size:.85rem;padding:.15rem .55rem;border-width:2px;box-shadow:2px 2px 0 var(--ink)}
.btn.sm.ghost{box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.armed{background:var(--sale);color:var(--on-sale)}

/* รูปสินค้า: ภาพจริงแบบไม่ตัดขอบ + พื้นหลังเบลอจากภาพเดียวกัน */
.ph{position:relative;overflow:hidden;border:.22rem solid var(--ink);border-radius:1rem;background:var(--card);min-height:0;min-width:0}
.ph img{position:absolute;inset:0;width:100%;height:100%;display:block}
.ph .bg{object-fit:cover;filter:blur(14px) saturate(1.15);transform:scale(1.2);opacity:.45}
.ph .fg{object-fit:contain}
.ph .emo{position:absolute;inset:0;display:grid;place-items:center;background:var(--burst);font-size:min(8rem,40%)}
.th{display:inline-block;flex:none;width:2.6rem;height:2.6rem;border-radius:.45rem;overflow:hidden;border:.12rem solid var(--ink);background:var(--card);vertical-align:middle;position:relative}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .emo{display:grid;place-items:center;width:100%;height:100%;background:var(--burst);font-size:1.4rem}

/* แถบเคาน์เตอร์ของ 3 ทีม */
.regs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;background:var(--ink);padding-block:.45rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.reg{display:flex;background:var(--card);border-radius:.6rem;overflow:hidden;min-width:0}
.reg-name{flex:none;max-width:40%;background:var(--tc);color:var(--on-sale);border:0;font-family:var(--f-display);font-weight:800;font-size:1.45rem;padding:.2rem .8rem;text-align:left;line-height:1.15}
.reg-name:hover{filter:brightness(1.1)}
.reg-body{display:flex;flex-wrap:wrap;align-items:center;gap:.2rem .6rem;padding:.25rem .6rem;min-width:0;flex:1}
.reg-cash{font-family:var(--f-display);font-weight:800;font-size:2rem;font-variant-numeric:tabular-nums;line-height:1.1}
.reg-wallet{display:flex;flex-wrap:wrap;gap:.25rem}
.reg-wallet .muted{font-size:.85rem}
.reg-basket{display:flex;gap:.2rem}
.reg-basket .th{width:1.9rem;height:1.9rem;border-width:.1rem}

/* คูปอง */
.chip{display:inline-block;background:var(--vc);color:var(--vt);font-family:var(--f-display);font-weight:700;font-size:1rem;line-height:1;padding:.32rem .5rem .32rem .55rem;border-radius:.3rem;border-left:3px dotted var(--card);white-space:nowrap}
.coupon{--notch:var(--paper);display:grid;grid-template-columns:auto minmax(0,1fr);background:var(--card);color:var(--ink);border:2px solid var(--vc);border-radius:.6rem;position:relative;text-align:left;min-width:0}
.coupon::before,.coupon::after{content:"";position:absolute;top:50%;width:.8rem;height:.8rem;margin-top:-.4rem;border-radius:50%;background:var(--notch);border:2px solid var(--vc)}
.coupon::before{left:-.45rem;clip-path:inset(0 0 0 50%)}
.coupon::after{right:-.45rem;clip-path:inset(0 50% 0 0)}
.c-stub{background:var(--vc);color:var(--vt);display:grid;place-content:center;justify-items:center;text-align:center;padding:.4rem .85rem .4rem .95rem;border-radius:.45rem 0 0 .45rem;border-right:2px dashed var(--card);min-width:5rem}
.c-stub small{font-size:.72rem;font-weight:600;line-height:1.2}
.c-stub b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:1.65rem;line-height:1.05}
.c-body{display:grid;align-content:center;gap:.1rem;padding:.35rem .95rem .35rem .65rem;min-width:0}
.c-body b{font-family:var(--f-display);font-weight:700;font-size:1rem;line-height:1.25}
.c-body span{font-size:.78rem;color:var(--ink-2);line-height:1.35}
.coupon.sm .c-stub{min-width:3.6rem;padding:.2rem .55rem .2rem .7rem}
.coupon.sm .c-stub small{display:none}
.coupon.sm .c-stub b{font-size:1.15rem}
.coupon.sm .c-body{padding:.2rem .8rem .2rem .5rem}
.coupon.sm .c-body b{font-size:.9rem}
.coupon.sm .c-body span{display:none}
.box .coupon,.qcard .coupon,.sheet .coupon{--notch:var(--card)}

/* หน้าแรก */
.home{align-content:center;gap:1.4rem}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:1.5rem}
.hero h1{font-weight:800;font-size:5.6rem;line-height:1.02}
.hero h1 em{font-style:italic;color:var(--sale)}
.lead{font-size:1.5rem;max-width:32ch;margin-top:.6rem}
.burst-wrap{filter:drop-shadow(.3rem .3rem 0 var(--ink))}
.burst{width:15rem;max-width:100%;aspect-ratio:1;background:var(--burst);clip-path:var(--burst-poly,none);display:grid;place-content:center;justify-items:center;color:var(--sale);transform:rotate(-8deg);animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
.burst span{font-family:var(--f-hand);font-size:1.6rem;color:var(--ink);line-height:1.2}
.burst b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:4.6rem;line-height:1}
@keyframes pop{from{transform:rotate(-40deg) scale(.5)}to{transform:rotate(-8deg) scale(1)}}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.2rem}
.act{display:grid;gap:.25rem;align-content:start;text-align:left;background:var(--card);border:.22rem solid var(--ink);border-radius:1rem;padding:1rem 1.3rem;box-shadow:.35rem .35rem 0 var(--ink);transition:transform .1s,box-shadow .1s}
.act:hover{transform:translate(-2px,-2px);box-shadow:.5rem .5rem 0 var(--ink)}
.act-k{font-family:var(--f-hand);color:var(--sale);font-size:1.2rem}
.act b{font-family:var(--f-display);font-weight:800;font-size:2.3rem;line-height:1.15}
.act>span:not(.act-k):not(.prog){font-size:1.1rem}
.act .prog{justify-self:start;margin-top:.3rem;background:var(--ink);color:var(--burst);font-weight:700;border-radius:999px;padding:.05rem .8rem;font-size:1rem}
.home-links{display:flex;flex-wrap:wrap;gap:.6rem}

.vhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:.6rem}
.vhead h2{font-size:2.3rem;font-weight:800;line-height:1.15}
.vhead-tools{display:flex;gap:.5rem;flex-wrap:wrap}

/* กระดานกิจกรรม 1 */
.boardv{grid-template-rows:auto minmax(0,1fr)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem;min-height:0}
.col{display:grid;grid-template-rows:auto;grid-auto-rows:minmax(0,1fr);gap:.65rem;min-height:0}
.col-head{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-family:var(--f-display);font-weight:700;font-size:1.5rem;padding-bottom:.3rem;border-bottom:.18rem solid var(--ink);line-height:1.25}
.stars{color:var(--sale);letter-spacing:.05em}
.col-rw{font-size:1rem;font-family:var(--f-hand);color:var(--ink-2);font-weight:400}
.tile{position:relative;display:flex;align-items:center;gap:.9rem;min-height:0;overflow:hidden;text-align:left;background:var(--card);border:.2rem solid var(--ink);border-radius:.8rem;padding:.45rem;box-shadow:.25rem .25rem 0 var(--ink);transition:transform .1s,box-shadow .1s}
.tile:hover{transform:translate(-2px,-2px);box-shadow:.35rem .35rem 0 var(--ink)}
.tile .ph{flex:none;height:100%;width:auto;aspect-ratio:1;max-width:55%;border-width:.14rem;border-radius:.55rem}
.t-no{font-family:var(--f-display);font-weight:800;font-size:2.2rem;line-height:1.1}
.tile>.chip{position:absolute;top:.35rem;right:.4rem}
.tile.done{background:var(--paper-2);border-style:dashed;box-shadow:none}
.tile.done .ph{opacity:.35}
.stamp{position:absolute;right:.5rem;top:50%;transform:translateY(-50%) rotate(-9deg);border:.2rem solid var(--tc);color:var(--tc);background:var(--card);font-family:var(--f-display);font-weight:800;font-size:1.15rem;padding:0 .5rem;border-radius:.4rem;white-space:nowrap;line-height:1.5}

/* หน้าโจทย์ — โจทย์ใหญ่เต็มจอ */
.qv{grid-template-rows:auto minmax(0,1fr) auto}
.qv-top{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem}
.tier{display:inline-flex;align-items:center;gap:.3rem;background:var(--ink);color:var(--burst);font-family:var(--f-display);font-weight:700;border-radius:999px;padding:.05rem 1rem;font-size:1.4rem;white-space:nowrap;line-height:1.5}
.rw-line{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:1.1rem}
.timer{display:flex;align-items:center;gap:.6rem;margin-left:auto}
.ring{width:3rem;height:3rem;transform:rotate(-90deg);flex:none}
.ring circle{fill:none;stroke-width:12}
.ring-bg{stroke:var(--paper-2)}
.ring-fg{stroke:var(--ink);stroke-dasharray:100;stroke-dashoffset:0;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.tm{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1.05;font-variant-numeric:tabular-nums;min-width:4.6ch}
.timer.low .tm,.timer.over .tm{color:var(--sale)}
.timer.low .ring-fg{stroke:var(--sale)}
.timer.over{animation:shake .4s 2}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.qv-stage{display:grid;grid-template-columns:minmax(0,.72fr) minmax(0,1.38fr);gap:1.1rem;min-height:0}
.qv-stage>.ph{border-width:.25rem;border-radius:1.2rem}
.qcard{background:var(--card);border:.25rem solid var(--ink);border-radius:1.2rem;box-shadow:.4rem .4rem 0 var(--ink);padding:1rem 1.4rem;overflow:hidden;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:.4em;font-size:1rem}
.qcard .item{font-family:var(--f-display);font-weight:700;font-size:2.2em;line-height:1.2}
.qcard .tags{display:flex;flex-wrap:wrap;gap:.6em}
.tag{display:grid;gap:.15em;align-content:start;padding:.35em .8em .45em;background:var(--paper);border:.16em dashed var(--ink);border-radius:.7em;min-width:0}
.tag small{font-family:var(--f-hand);font-size:1.3em;color:var(--ink-2);line-height:1.2}
.price{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:5.2em;line-height:1.05;font-variant-numeric:tabular-nums}
.badge{justify-self:start;background:var(--sale);color:var(--burst);font-family:var(--f-display);font-weight:700;font-size:1.9em;padding:0 .5em;border-radius:.2em;transform:skewX(-8deg);line-height:1.45}
.q-text{font-weight:700;font-size:3.8em;line-height:1.28}
.choices{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45em;font-size:2.2em}
.choices li{display:flex;align-items:center;gap:.45em;border:.1em solid var(--ink);border-radius:.45em;padding:.2em .5em;font-weight:600;background:var(--card);min-width:0;line-height:1.3}
.choices li b{flex:none;width:1.5em;height:1.5em;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--burst);font-family:var(--f-display)}
.choices li.correct{background:var(--ok);border-color:var(--ok);color:var(--on-sale)}
.choices li.correct b{background:var(--on-sale);color:var(--ok)}
.sol-q{font-size:1.35em;color:var(--ink-2);font-weight:600;line-height:1.35}
.sol-k{justify-self:start;align-self:flex-start;background:var(--ink);color:var(--burst);font-family:var(--f-display);font-weight:700;font-size:1.2em;padding:0 .7em;border-radius:999px}
.ans{font-family:var(--f-display);font-weight:800;font-size:4.2em;line-height:1.15;color:var(--sale)}
.steps-l{margin:0;padding-left:1.3em;display:grid;gap:.15em;font-size:2em;line-height:1.35}
.qv-ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.qv-ctrl .grow{flex:1}
.jt{display:flex;align-items:center;gap:.3rem;background:var(--tc);color:var(--on-sale);border:.17rem solid var(--ink);border-radius:.7rem;padding:.2rem .25rem .2rem .7rem}
.jt-n{font-family:var(--f-display);font-weight:700;font-size:1.2rem;line-height:1.2;margin-right:.2rem;white-space:nowrap}
.jt-n small{font-family:var(--f-body);font-size:.75rem;background:var(--card);color:var(--ink);border-radius:4px;padding:0 .3rem;vertical-align:middle}
.jb{border:2px solid var(--ink);background:var(--card);border-radius:.45rem;padding:.1rem .7rem;font-weight:800;font-size:1rem}
.jb.ok{color:var(--ok)}
.jb.no{color:var(--no)}
.jb:disabled{opacity:.45;cursor:not-allowed}
.jt.locked{filter:grayscale(.85);opacity:.6}
.jt.won{box-shadow:0 0 0 .25rem var(--burst)}
.note{font-weight:700;color:var(--sale);font-size:1.1rem}

/* หน้าคั่นก่อนเปิดโจทย์: ซ่อนโจทย์ไว้จนครูกด "เริ่ม!" */
.cover{grid-template-rows:auto minmax(0,1fr)}
.cover-card{position:relative;overflow:hidden;isolation:isolate;background:var(--sale);color:var(--on-sale);border:.25rem solid var(--ink);border-radius:1.4rem;box-shadow:.45rem .45rem 0 var(--ink);display:grid;place-content:center;justify-items:center;gap:.5rem;text-align:center;padding:1.5rem;min-height:0}
.cover-card::before{content:"";position:absolute;inset:-60%;z-index:-1;background:repeating-conic-gradient(from 0deg,var(--sale) 0 9deg,var(--sale-2) 9deg 18deg);opacity:.6;animation:spin 50s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.cover-k{font-family:var(--f-hand);font-size:1.9rem;color:var(--burst);line-height:1.25}
.cover-no{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:9.5rem;line-height:1.05;color:var(--burst);text-shadow:.35rem .35rem 0 var(--ink)}
.cover-tier{font-family:var(--f-display);font-weight:700;font-size:2.3rem;line-height:1.2}
.cover-meta{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.5rem 1.4rem;font-size:1.5rem;font-weight:600}
.cover-meta .coupon{--notch:var(--sale);font-size:1.2rem}
.go{font-family:var(--f-display);font-size:2.8rem;font-weight:800;line-height:1.3;background:var(--burst);color:var(--ink);border:.25rem solid var(--ink);border-radius:999px;padding:.15rem 3rem;box-shadow:.35rem .35rem 0 var(--ink);animation:pulse 1.4s ease-in-out infinite;margin-top:.5rem}
.go:active{animation:none;transform:translate(3px,3px);box-shadow:none}
@keyframes pulse{50%{transform:scale(1.07)}}
.cover-hint{font-size:1.1rem;opacity:.92}
.qv-stage.pop{animation:qpop .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes qpop{from{transform:scale(.55) rotate(-2deg);opacity:.15}to{transform:none;opacity:1}}

/* กิจกรรม 2 ประมูล */
.av{grid-template-columns:minmax(12rem,15rem) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.lots{display:flex;flex-direction:column;gap:.4rem;overflow:auto;min-height:0;padding:0 .3rem .3rem 0}
.lots-h{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.lots-h h3{font-size:1.4rem}
.lot-btn{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:.55rem;align-items:center;text-align:left;background:var(--card);border:.17rem solid var(--ink);border-radius:.7rem;padding:.3rem .5rem;flex:none}

let AC=null;
function tone(f,d,type='sine',vol=.14,when=0){
  if(!S||!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);
}

  no:()=>{tone(190,.22,'square',.09);tone(140,.3,'square',.09,.17);},
  bid:()=>tone(700,.08,'triangle',.12),
  bang:()=>{tone(95,.28,'square',.2);tone(55,.4,'sine',.3,.02);},

/* คิดราคาสุทธิจากราคาประมูลและคูปองที่เลือก */
function calc(bid,codes){
  const steps=[];let price=bid,cashback=0;
  const main=codes.find(c=>VOUCHERS[c].kind!=='extra'),extra=codes.find(c=>VOUCHERS[c].kind==='extra');
  if(main){const v=VOUCHERS[main];
    if(v.kind==='pct'){let d=r2(bid*v.pct/100);
      steps.push(`${v.pct}% ของ ${money(bid)} = ${money(bid)} × ${v.pct}/100 = ${money(d)} บาท`);
      if(v.cap&&d>v.cap){steps.push(`เกินเพดาน จึงลดได้แค่ ${money(v.cap)} บาท`);d=v.cap;}
      price=r2(bid-d);steps.push(`ราคาหลังลด = ${money(bid)} − ${money(d)} = ${money(price)} บาท`);
    }else if(v.kind==='fixed'){price=r2(bid-v.amt);steps.push(`ลดทันที ${v.amt} บาท: ${money(bid)} − ${v.amt} = ${money(price)} บาท`);}
  }
  if(extra){const d=r2(price*10/100),np=r2(price-d);
    steps.push(`ลดเพิ่ม 10% ของ ${money(price)} = ${money(d)} บาท`);
    steps.push(`ราคาหลังลดเพิ่ม = ${money(price)} − ${money(d)} = ${money(np)} บาท`);price=np;}
  if(main&&VOUCHERS[main].kind==='cashback'){cashback=r2(price*20/100);
    steps.push(`จ่าย ${money(price)} บาท แล้วได้เงินคืน 20% = ${money(cashback)} บาท`);
    steps.push(`จ่ายจริงสุทธิ = ${money(price)} − ${money(cashback)} = ${money(r2(price-cashback))} บาท`);}
  if(!steps.length)steps.push('ไม่ใช้คูปอง จ่ายเต็มราคา');
  const net=r2(price-cashback);
  return {steps,net,saved:r2(bid-net)};
}

const T={total:60,left:60,run:false,end:0,iv:null,sel:'#qtimer',lastS:null};
function tSet(sec,sel){tStop();T.total=sec;T.left=sec;T.sel=sel;T.lastS=null;tDraw();}
function tStart(){if(T.left<=0)T.left=T.total;T.run=true;T.end=performance.now()+T.left*1000;clearInterval(T.iv);T.iv=setInterval(tTick,200);tDraw();}
function tPause(){if(!T.run)return;T.left=Math.max(0,(T.end-performance.now())/1000);T.run=false;clearInterval(T.iv);tDraw();}
function tStop(){T.run=false;clearInterval(T.iv);}
function tTick(){T.left=Math.max(0,(T.end-performance.now())/1000);const s=Math.ceil(T.left);
  if(s!==T.lastS){T.lastS=s;if(s<=5&&s>0)SFX.tick();}
  if(T.left<=0){tStop();SFX.end();}tDraw();}
function tDraw(){const el=$(T.sel);if(!el)return;const s=Math.ceil(T.left);
  el.querySelector('.tm').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  const fg=el.querySelector('.ring-fg');if(fg)fg.style.strokeDashoffset=String(100-100*T.left/T.total);
  el.classList.toggle('low',T.left<=10&&T.left>0);el.classList.toggle('over',T.left<=0);
  const b=$('#tgo');if(b)b.textContent=T.run?'หยุดเวลา':(T.left>0&&T.left<T.total?'เดินเวลาต่อ':'เริ่มจับเวลา');}

  const cols=['var(--sale)','var(--burst)','var(--t0)','var(--t1)','var(--t2)','var(--v-p20)'];
  for(let i=0;i<80;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=cols[i%cols.length];
    p.style.setProperty('--dx',((Math.random()*2-1)*160)+'px');p.style.setProperty('--r',(Math.random()*900-450)+'deg');
    p.style.animationDelay=(Math.random()*.3)+'s';box.appendChild(p);}

function barcode(seed){
  const digits='885'+String(4021+seed*137).padStart(4,'0')+'0'+String(seed+1)+'26';let bars='';
  for(const ch of digits+digits.split('').reverse().join('')){const d=+ch;bars+=`<i style="width:${1+d%3}px"></i><i class="g" style="width:${1+(d*7)%3}px"></i>`;}
  return `<div class="barcode" aria-hidden="true"><div class="bars">${bars}</div><small>${digits}</small></div>`;
}

function vResults(){
  const data=S.teams.map((t,i)=>{const bid=sum(t.basket.map(b=>b.bid)),paid=r2(sum(t.basket.map(b=>b.paid))),saved=r2(bid-paid),pct=bid?r2(saved/bid*100):0;return {t,i,bid,paid,saved,pct};});
  const any=data.some(d=>d.t.basket.length),best=Math.max(...data.map(d=>d.pct));
  const rec=data.map(d=>{const isBest=any&&best>0&&d.pct===best;
    return `<article class="receipt" style="${tc(d.i)}">
     <header><b class="rc-team">${esc(d.t.name)}</b><small class="muted">ร้อยละ MEGA SALE · ใบเสร็จ</small>${isBest?'<span class="best-tag">นักช้อปคุ้มที่สุด</span>':''}</header>

     <div class="rc-pct"><small>ประหยัดได้</small><b>${money(d.pct)}%</b><small>ของราคาประมูลรวม</small></div>

     <details><summary>ดูเฉลย</summary><ol><li>${more?'แพงกว่า':'ถูกกว่า'} ${money(Math.abs(diff))} บาท</li><li>${money(Math.abs(diff))}/${money(l.store)} × 100 = ${money(pct)}%</li></ol></details></div>`;}
  return `<section class="wrap"><div class="vhead"><div><p class="eyebrow">ปิดร้าน</p><h2>สรุปผลการช้อป</h2></div><div class="vhead-tools"><button class="btn" data-go="a2">← กลับไปประมูล</button></div></div>

/* ---------- รูปที่ครูอัปโหลด: ย่อเป็น JPEG ไม่เกิน 720px ---------- */
function readPhoto(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
  const s=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  const g=c.getContext('2d');g.fillStyle='#ffffff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82));};im.src=fr.result;};fr.readAsDataURL(file);});}
function setImg(kind,id,src){const o=kind==='q'?S.questions.find(x=>x.id===id):S.lots.find(x=>x.id===id);if(!o)return;const old=o.img;o.img=src;
  if(!save()){toast('ใช้รูปนี้ได้ในรอบนี้ แต่บันทึกในเบราว์เซอร์ไม่ได้ (พื้นที่เต็มหรือถูกปิดไว้)');}
  render();return old;}

function finalize(useV){
  const a=S.auction,ti=a.leader,t=S.teams[ti],l=getLot(a.lotId);
  const codes=useV?a.co.sel.map(uid=>(walletItem(ti,uid)||{}).code).filter(Boolean):[];
  const paid=useV?calc(a.high,codes).net:a.high;
  t.budget=r2(t.budget-paid);
  if(useV)a.co.sel.forEach(uid=>{const w=walletItem(ti,uid);if(w)w.used=l.id;});
  t.basket.push({lotId:l.id,bid:a.high,paid,codes});
  S.lotDone[l.id]={team:ti,bid:a.high,paid,codes};
  const bid=a.high;tStop();S.auction=null;save();render();SFX.ok();
  toast(`<b>${esc(t.name)}</b> ได้${esc(l.name)} · จ่าย ฿${money(paid)}${paid<bid?` (ประหยัด ฿${money(bid-paid)})`:''}`);
}

});
document.addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('qe')){if(d.open)UI.openQ=d.dataset.q;else if(UI.openQ===d.dataset.q)UI.openQ=null;}},true);
function parseTags(v){return v.split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{const p=line.split('|').map(x=>x.trim());
  if(p.length>=3)return {label:p[0],price:p[1],badge:p[2]};if(p.length===2)return {price:p[0],badge:p[1]};return {price:p[0]};});}
function onBind(e){
  const el=e.target;
  if(el.dataset&&el.dataset.up&&e.type==='change'){const file=el.files&&el.files[0];if(!file)return;
    readPhoto(file).then(src=>setImg(el.dataset.up,el.dataset.id,src)).catch(()=>toast('เปิดรูปนี้ไม่ได้ ลองใช้ไฟล์ JPG หรือ PNG'));return;}
  const k=el.dataset&&el.dataset.bind;if(!k)return;
  if(k==='team-name'){const i=+el.dataset.t;S.teams[i].name=el.value.trim()||('ทีม '+(i+1));renderTeams();}
  else if(k==='team-budget'){S.teams[+el.dataset.t].budget=r2(Math.max(0,+el.value||0));renderTeams();}
  else if(k==='set'){const v=Math.round(+el.value||0);if(v<=0)return;S.settings[el.dataset.k]=v;
    if(el.dataset.k==='budget'&&!Object.keys(S.lotDone).length&&!S.auction){S.teams.forEach(t=>t.budget=v);renderTeams();}}
  else if(k==='lot'){const l=S.lots[+el.dataset.i],f=el.dataset.f;if(!l)return;
    if(f==='mystery')l.mystery=el.checked;else if(f==='store'||f==='start')l[f]=Math.max(0,+el.value||0);else l[f]=el.value;}
  else if(k==='q'){const q=S.questions.find(x=>x.id===el.dataset.q);if(!q)return;const f=el.dataset.f,v=el.value;
    if(f==='tier'){if(e.type!=='change')return;q.tier=+v;if(q.tier===4){q.choices=q.choices&&q.choices.length?q.choices:['','','',''];q.correct=q.correct??0;q.reward=q.reward||'F50';}
      UI.openQ=q.id;save();render();return;}
    if(f==='tags')q.tags=parseTags(v);else if(f==='steps')q.steps=v.split('\n').map(s=>s.trim()).filter(Boolean);
    else if(f==='choices')q.choices=v.split('\n').map(s=>s.trim()).slice(0,4);else if(f==='correct')q.correct=+v;else q[f]=v;}
  save();
}
